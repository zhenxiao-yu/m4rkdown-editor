name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_N854M53gDdl6HNscNxNMTcmS
  VERCEL_PROJECT_ID: prj_MfXHjEwE3OilT3d6vpqc53HZaxxh

jobs:
  # ── Shared build ──────────────────────────────────────────────────────
  # Single build that all deploy jobs reuse.
  # Uses `vercel build` so env vars come from Vercel project settings
  # and the prebuilt output is uploaded as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel — prebuilt output)
        run: npx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Upload Vercel prebuilt output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output
          retention-days: 1

      - name: Upload Pages artifact (from Vercel static output)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  # ── GitHub Pages ─────────────────────────────────────────────────────
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Vercel ───────────────────────────────────────────────────────────
  # Downloads the prebuilt artifact — no rebuild on Vercel's cloud.
  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://m4rkdown-editor.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download prebuilt output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy to Vercel (prebuilt — no cloud rebuild)
        run: npx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }}

  # PartyKit deploy removed — run `npx partykit deploy` locally when needed
