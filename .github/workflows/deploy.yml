name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'   # LTS — broad prebuilt binary support for native addons
  VERCEL_ORG_ID: team_N854M53gDdl6HNscNxNMTcmS
  VERCEL_PROJECT_ID: prj_MfXHjEwE3OilT3d6vpqc53HZaxxh

jobs:
  # ── Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Generate static assets — graceful fallback if native addons unavailable
      - name: Generate assets
        run: node scripts/gen-icons.mjs; node scripts/gen-og.mjs
        continue-on-error: true

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Upload Vercel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vercel-output
          path: .vercel/output
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vercel/output/static

  # ── Deploy: Vercel ────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy → Vercel
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://m4rkdown.is-a.dev
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy (prebuilt — no cloud rebuild)
        run: npx --yes vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }}

  # ── Deploy: GitHub Pages ──────────────────────────────────────────────
  deploy-pages:
    name: Deploy → GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # ── Deploy: PartyKit ──────────────────────────────────────────────────
  # Only runs when server-side files change (avoids redundant deploys)
  deploy-partykit:
    name: Deploy → PartyKit
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits), '"party/') ||
      contains(toJson(github.event.commits), '"src/lib/arena-types') ||
      contains(toJson(github.event.commits), '"src/lib/game-engine')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install --prefer-offline

      - name: Deploy PartyKit server
        run: npx partykit deploy
        env:
          PARTYKIT_LOGIN: zhenxiao-yu
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
