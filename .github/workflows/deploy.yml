name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  VERCEL_ORG_ID: team_N854M53gDdl6HNscNxNMTcmS
  VERCEL_PROJECT_ID: prj_MfXHjEwE3OilT3d6vpqc53HZaxxh

jobs:
  # ── Build ─────────────────────────────────────────────────────────────
  # Single build shared by all deploy jobs.
  # vercel build pulls env vars from Vercel project settings so the
  # same artifact is deployed everywhere with no rebuild.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Upload Vercel artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  # ── Deploy: Vercel ────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy → Vercel
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://m4rkdown.is-a.dev
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy (prebuilt — no cloud rebuild)
        run: npx --yes vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }}

  # ── Deploy: GitHub Pages ──────────────────────────────────────────────
  deploy-pages:
    name: Deploy → GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ── Deploy: PartyKit ──────────────────────────────────────────────────
  deploy-partykit:
    name: Deploy → PartyKit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Deploy PartyKit server
        run: npx partykit deploy
        env:
          PARTYKIT_LOGIN: zhenxiao-yu
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
